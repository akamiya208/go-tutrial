services:
  go: &go
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on: # see: https://docs.docker.com/compose/startup-order/
      mysql:
        condition: service_healthy
        restart: true
    volumes:
      - .:/app
    tty: true
    ports:
      - "8080:8080"

  mysql: &mysql
    image: mysql:8
    volumes:
      - go_tutrial_mysql_data:/var/lib/mysql
    env_file:
      - .envs/.mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -hlocalhost -uroot -p$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  go_tutrial_mysql_data:
